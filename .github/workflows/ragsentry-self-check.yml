name: RagSentry Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rag-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run unit & integration tests
        run: |
          pytest tests/ -v

      - name: Run evaluation on toy fixture
        run: |
          ragsentry run \
            --evalset examples/toy_rag_fixture/sample_evalset.jsonl \
            --adapter examples.toy_rag_fixture.toy_retriever:query \
            --out runs/

      - name: Locate candidate run
        id: find_run
        run: |
          CANDIDATE=$(ls -t runs/run_*.json | head -n 1)
          echo "candidate=$CANDIDATE" >> $GITHUB_OUTPUT

      - name: Check CI Gate
        run: |
          ragsentry ci \
            --candidate "${{ steps.find_run.outputs.candidate }}" \
            --pr-comment-out pr_comment.md

      - name: Append report to Job Summary
        if: always()
        run: |
          if [ -f pr_comment.md ]; then
            cat pr_comment.md >> $GITHUB_STEP_SUMMARY
          fi
